services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vetmedagri
    ports:
      - "5433:5432"   # exposed to host so local npm run dev can connect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d vetmedagri"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API + Frontend (single Express server) ────────────────────────────────────
  # Serves: React SPA at /, /api/* routes, /wp-content/uploads/* media, /sitemap.xml
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/vetmedagri?schema=public
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:3001}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      HITPAY_API_KEY: ${HITPAY_API_KEY:-}
      HITPAY_SALT: ${HITPAY_SALT:-}
      HITPAY_API_URL: ${HITPAY_API_URL:-https://api.hit-pay.com/v1}
      WC_WEBHOOK_SECRET: ${WC_WEBHOOK_SECRET:-}
      WC_API_URL: ${WC_API_URL:-}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist extracted product images across container rebuilds
      - media:/app/public/wp-content/uploads

  # ── MariaDB (ETL source — only needed if re-running migration) ────────────────
  # Comment this service out once ETL is complete and Postgres is populated.
  mariadb:
    image: mariadb:11
    restart: "no"
    profiles: ["etl"]          # only starts with: docker compose --profile etl up
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wp
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "-uroot", "-proot", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
  mariadb_data:
