services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: vetmedagri
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d vetmedagri"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/vetmedagri?schema=public
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?required}
      CORS_ORIGIN: ${SITE_URL}
      MEDIA_BASE_URL: ${SITE_URL}
      SITE_URL: ${SITE_URL:?required}
      HITPAY_API_KEY: ${HITPAY_API_KEY:-}
      HITPAY_SALT: ${HITPAY_SALT:-}
      HITPAY_API_URL: https://api.hit-pay.com/v1
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/public/wp-content/uploads

volumes:
  pgdata:
  media:
